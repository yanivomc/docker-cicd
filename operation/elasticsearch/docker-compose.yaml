  kib01:
    image: docker.elastic.co/kibana/kibana:8.17.3
    container_name: kib01
    environment:
      ELASTICSEARCH_HOSTS: http://es01:9200
    ports:
      - 5601:5601
    networks:
      - esnetnew

  # logger:
  #   build:
  #     dockerfile: ./Dockerfile
  #   container_name: log-generator
  #   networks:
